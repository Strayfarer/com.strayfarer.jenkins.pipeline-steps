name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release plugin
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a tag like 0.1.0, got: $RELEASE_TAG"
            exit 1
          fi

          echo "number=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and verify release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        run: >
          ./mvnw
          --batch-mode
          --no-transfer-progress
          "-Drevision=${RELEASE_VERSION}"
          "-DscmTag=${RELEASE_VERSION}"
          clean verify

      - name: Create checksum
        working-directory: target
        run: sha256sum pipeline-steps.hpi > pipeline-steps.hpi.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "target/pipeline-steps.hpi#Jenkins plugin" \
            "target/pipeline-steps.hpi.sha256#SHA-256 checksum" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
